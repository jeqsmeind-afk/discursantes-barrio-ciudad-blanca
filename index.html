<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discursantes - Barrio Ciudad Blanca</title>
    <style>
        /* Estilos inspirados en el portal LCR */
        body { font-family: "Open Sans", "Roboto", "Arial", sans-serif; background-color: #f8f9fa; margin: 0; color: #333; padding-bottom: 40px; }
        
        /* Barra superior LCR */
        .top-bar { background-color: #002d42; color: #fff; padding: 12px 20px; display: flex; flex-direction: column; gap: 4px; }
        .top-bar h1 { margin: 0; font-size: 1.1em; font-weight: 400; }
        .top-bar .unit-info { font-size: 0.8em; color: #b3c2cb; }
        
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        
        /* Título de la página */
        .page-header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .page-title { font-size: 1.8em; font-weight: 300; margin: 0; color: #202124; }
        
        /* Botón estilo institucional */
        .btn-registrar { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background-color: #007c8f; color: white; padding: 10px 20px; border-radius: 3px; text-decoration: none; font-size: 0.95em; font-weight: 500; border: 1px solid #006070; transition: background-color 0.2s; }
        .btn-registrar:active { background-color: #00596b; }
        
        /* Pestañas de filtro (En lugar de botones ovalados) */
        .filtros { display: flex; gap: 20px; border-bottom: 1px solid #dadce0; margin-bottom: 20px; overflow-x: auto; }
        .btn-filtro { background: none; border: none; font-size: 0.95em; color: #5f6368; cursor: pointer; padding: 8px 4px; position: relative; white-space: nowrap; }
        .btn-filtro.activo { color: #007c8f; font-weight: 600; }
        .btn-filtro.activo::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background-color: #007c8f; border-radius: 3px 3px 0 0; }
        
        /* Tarjetas limpias y planas */
        .card { background: white; border: 1px solid #dadce0; border-radius: 4px; padding: 16px; margin-bottom: 12px; }
        .card .name { font-size: 1.25em; font-weight: 400; color: #202124; margin-bottom: 12px; }
        .info-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .info-item { display: flex; flex-direction: column; gap: 2px; }
        .info-item span.label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; color: #70757a; font-weight: 600; }
        .info-item span.value { font-size: 0.9em; color: #3c4043; }
        
        /* Estados del discurso */
        .status-urgent { color: #d93025 !important; font-weight: 500; }
        .status-ok { color: #1e8e3e !important; font-weight: 500; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Fuentes de recursos para el obispado</h1>
        <span class="unit-info">Estaca Arequipa Perú Paucarpata (1646176) | Barrio Ciudad Blanca (215864)</span>
    </div>

    <div class="container">
        <div class="page-header">
            <h2 class="page-title">Asignación de Discursantes</h2>
            <!-- AQUÍ PONES EL LINK DE TU GOOGLE FORM -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdKd5Q2BDbi_lm3LAYOnvWgSC7t7Or-UtCltasqbCeFKQZFSg/viewform?usp=header" target="_blank" class="btn-registrar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Registrar Asignación
            </a>
        </div>

        <div class="filtros">
            <button class="btn-filtro activo" onclick="filtrar('todos', this)">Lista completa</button>
            <button class="btn-filtro" onclick="filtrar('sugerencias', this)">Sugerencias pendientes</button>
            <button class="btn-filtro" onclick="filtrar('recientes', this)">Asignados recientemente</button>
        </div>
        
        <div id="lista-miembros" style="color: #5f6368; font-size: 0.9em;">Cargando registros...</div>
    </div>

    <script>
        // AQUÍ PONES TU ENLACE DE APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbw_73dkyDLwga1r_kMxPNX5QA0PyBIYTcjirDUCxMDwv46zLLDAextABAzL_shn0o8/exec';

        let miembrosData = [];

        function calcularEdad(fechaNacimiento) {
            if (!fechaNacimiento) return "--";
            const partes = fechaNacimiento.split('/');
            if (partes.length !== 3) return "--";
            const fechaNac = new Date(partes[2], partes[1] - 1, partes[0]);
            const hoy = new Date();
            let edad = hoy.getFullYear() - fechaNac.getFullYear();
            const mes = hoy.getMonth() - fechaNac.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < fechaNac.getDate())) {
                edad--;
            }
            return edad;
        }

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                miembrosData = data;
                renderizarLista(miembrosData);
            })
            .catch(error => {
                document.getElementById('lista-miembros').innerHTML = 'Error de conexión con la base de datos.';
                console.error(error);
            });

        function renderizarLista(datos) {
            const contenedor = document.getElementById('lista-miembros');
            contenedor.innerHTML = ''; 

            if (datos.length === 0) {
                contenedor.innerHTML = '<p>No se encontraron registros en esta categoría.</p>';
                return;
            }

            datos.forEach(miembro => {
                const div = document.createElement('div');
                div.className = 'card';
                
                const esUrgente = miembro.ultimoDiscurso === "";
                const edadCalculada = calcularEdad(miembro.nacimiento);
                
                // Formateo del estado
                const estadoHtml = esUrgente 
                    ? `<span class="value status-urgent">Sin registro reciente</span>`
                    : `<span class="value status-ok">${miembro.ultimoDiscurso}</span>`;

                div.innerHTML = `
                    <div class="name">${miembro.nombre}</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">Sexo</span>
                            <span class="value">${miembro.sexo}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Edad</span>
                            <span class="value">${edadCalculada} años</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Último Discurso</span>
                            ${estadoHtml}
                        </div>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        function filtrar(tipo, botonClicado) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            botonClicado.classList.add('activo');

            let datosFiltrados = [];
            if (tipo === 'todos') {
                datosFiltrados = miembrosData;
            } else if (tipo === 'sugerencias') {
                datosFiltrados = miembrosData.filter(m => m.ultimoDiscurso === "");
            } else if (tipo === 'recientes') {
                datosFiltrados = miembrosData.filter(m => m.ultimoDiscurso !== "");
            }
            
            renderizarLista(datosFiltrados);
        }
    </script>
</body>
</html>
